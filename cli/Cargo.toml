[package]
name = "leko-cli"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The leko command: canonical 5-pillar rule management on the native Leko core."

[lib]
name = "leko_cli"
path = "src/lib.rs"

[[bin]]
name = "leko"
path = "src/main.rs"

[dependencies]
leko-core = { path = "../core" }
leko-enforcers-browser = { path = "../enforcers/browser" }
leko-platform-macos = { path = "../platform/macos" }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
sha2 = "0.10"
