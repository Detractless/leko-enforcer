[package]
name = "leko-pill"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Floating monochrome WebView pill for Leko Voice Assistant"

[[bin]]
name = "leko-pill"
path = "src/main.rs"

[dependencies]
wry = { version = "0.47", features = ["transparent"] }
tao = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.2", features = ["NSEvent", "NSScreen", "NSWindow"] }
