[package]
name = "leko-pill"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Floating monochrome WebView pill for Leko Voice Assistant"

[[bin]]
name = "leko-pill"
path = "src/main.rs"

[dependencies]
wry = "0.47"
tao = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
