<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leko Pill</title>
</head>
<body>
<div id="card" class="reply-card" hidden role="region" aria-label="Leko reply card">
  <button id="card-close" class="card-close" type="button" aria-label="Close reply card">&times;</button>
  <div id="card-body" class="card-body"></div>
  <table id="card-table" class="card-table" hidden>
    <thead id="card-head"></thead>
    <tbody id="card-rows"></tbody>
  </table>
</div>
<div id="pill-slot" class="pill-slot">
  <button id="pill" class="leko-pill state-idle" type="button" aria-label="Leko voice pill">
    <span class="dash"></span>
    <span class="bars" id="bars"></span>
    <span class="dots" id="dots"><span></span><span></span><span></span></span>
    <span class="label" id="label"></span>
  </button>
</div>
</body>
</html>
