<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leko</title>
  <link rel="stylesheet" href="circle.css">
</head>
<body>
  <div class="viewport-container">
    <div id="stage" class="circle-stage state-idle">
      <div class="ripple ripple-1"></div>
      <div class="ripple ripple-2"></div>
      <div class="ripple ripple-3"></div>
      <div class="ring-core"></div>
      <div id="status" class="status-pill">Ready</div>
    </div>

    <!-- Minimalist Utility Controls -->
    <div class="controls-bar">
      <button id="btn-mute" class="ctrl-btn" title="Toggle microphone mute">Mute</button>
      <button id="btn-stop" class="ctrl-btn" title="Interrupt speech or reset draft">Stop</button>
    </div>

    <!-- Minimalist Plan Confirmation Card -->
    <div id="draft-card" class="draft-card">
      <div class="card-header">
        <span class="card-title">Social Media Block</span>
        <span class="card-badge">2h Lock</span>
      </div>
      <div class="card-details">
        Blocks reddit.com, twitter.com until 02:45 AM.
      </div>
      <div class="card-actions">
        <button id="btn-cancel" class="btn btn-secondary">Dismiss</button>
        <button id="btn-confirm" class="btn btn-primary">Confirm & Lock</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const stageEl = document.getElementById('stage');
    const statusEl = document.getElementById('status');
    const cardEl = document.getElementById('draft-card');

    const controller = new CircleController(stageEl, statusEl, cardEl);
    const bridge = new LekoBridge(controller);

    document.getElementById('btn-confirm').addEventListener('click', () => controller.confirmDraft());
    document.getElementById('btn-cancel').addEventListener('click', () => controller.cancelDraft());
    document.getElementById('btn-mute').addEventListener('click', () => bridge.toggleMute());
    document.getElementById('btn-stop').addEventListener('click', () => bridge.stop());

    // Tap circle to toggle listening or interrupt speech back to Ready
    stageEl.addEventListener('click', () => {
      if (controller.currentState === 'idle') {
        controller.setState('listening', 'Listening...');
        bridge.sendIpcAction('listen_start');
      } else {
        // In speaking, listening, or thinking: interrupt/stop back to Ready
        bridge.stop();
      }
    });

    // Space key acts as a toggle:
    // If idle -> start listening
    // If speaking, thinking, or listening -> interrupt/stop back to Ready
    // Escape key always interrupts/resets to Ready
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
        return;
      }
      if (e.code === 'Space') {
        e.preventDefault();
        if (controller.currentState === 'idle') {
          controller.setState('listening', 'Listening...');
          bridge.sendIpcAction('listen_start');
        } else {
          bridge.stop();
        }
      } else if (e.code === 'Escape') {
        e.preventDefault();
        bridge.stop();
      }
    });
  </script>
</body>
</html>
